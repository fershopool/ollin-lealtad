<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel · Quetzalitos</title>
  <link rel="icon" type="image/png" href="../img/icono.png">
  <link rel="apple-touch-icon" href="../img/icono.png">
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../estilo.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main>
    <header class="cabecera"><div class="greca"></div></header>
    <div class="logo-halo logo-mediano"><img src="../img/logo.png" alt="Quetzalitos" width="476" height="478"></div>
    <h1>Panel de Quetzalitos</h1>

    <form id="form-clave">
      <label for="clave">Clave admin</label>
      <input id="clave" class="campo" type="password" autocomplete="off" required>
      <button id="ver" class="btn btn-oro" type="submit">Ver métricas</button>
    </form>

    <label for="periodo">Periodo</label>
    <select id="periodo" class="campo">
      <option value="7">Últimos 7 días</option>
      <option value="30">Últimos 30 días</option>
      <option value="">Todo</option>
    </select>

    <p id="estado" class="aviso oculto" role="status"></p>
    <p id="error" class="error oculto" role="alert"></p>

    <div id="tabla" class="panel-tabla oculto">
      <table>
        <thead>
          <tr>
            <th>Cafetería</th><th>Escuela</th><th>Ventas</th><th>Reclamos</th>
            <th>Adopción</th><th>Canjes</th><th>Tarjetas nuevas</th>
          </tr>
        </thead>
        <tbody id="cuerpo"></tbody>
      </table>
    </div>

    <p class="aviso">Ventas = QR generados por la cajera. No se ven las ventas donde la cajera no tocó el botón. Reclamos = QR escaneados por clientes.</p>
    <footer class="pie"><div class="greca"></div></footer>
  </main>

  <script src="../config.js"></script>
  <script src="../lib.js"></script>
  <script src="panel.js"></script>
</body>
</html>
