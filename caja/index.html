<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-title" content="Caja Quetzalitos">
  <meta name="theme-color" content="#2E6458">
  <title>Caja Quetzalitos</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../estilo.css">
</head>
<body>
<main>
  <section id="carga">
    <p id="carga-verificando" class="centro" aria-live="polite">Verificando…</p>
    <p id="carga-msg" aria-live="polite" class="oculto"></p>
    <button id="btn-reintentar" class="btn btn-grande oculto" type="button">Reintentar</button>
  </section>

  <section id="login" class="oculto">
    <h1>Entrar a caja</h1>
    <form id="form-login">
      <label for="pin">PIN de la cafetería</label>
      <input id="pin" class="campo" type="password" inputmode="numeric" autocomplete="off">
      <button id="btn-entrar" class="btn btn-grande" type="submit">Entrar</button>
    </form>
    <p id="login-msg" aria-live="polite" class="oculto"></p>
  </section>

  <section id="menu" class="oculto">
    <div class="fila">
      <h1 id="nombre"></h1>
      <button id="btn-salir" class="btn btn-chico btn-claro" type="button">Salir</button>
    </div>
    <button id="btn-venta" class="btn btn-grande" type="button">Venta de postre</button>
    <button id="btn-canje" class="btn btn-grande btn-claro" type="button">Canjear premio</button>
    <p id="menu-msg" aria-live="polite" class="oculto"></p>
  </section>

  <section id="venta" class="oculto">
    <h1>Venta de postre</h1>
    <div id="qr" class="qr-caja"></div>
    <p class="centro">Que el cliente lo escanee con la cámara</p>
    <p id="cuenta" class="cuenta"></p>
    <button id="btn-listo" class="btn btn-grande" type="button">Listo</button>
  </section>

  <section id="canje" class="oculto">
    <h1>Canjear premio</h1>
    <label for="codigo">Código de 6 dígitos</label>
    <input id="codigo" class="campo" type="text" inputmode="numeric" maxlength="6" autocomplete="off">
    <button id="btn-validar" class="btn btn-grande" type="button">Validar</button>
    <p id="canje-msg" aria-live="polite" class="oculto"></p>
    <button id="btn-volver-canje" class="btn btn-claro" type="button">Volver</button>
  </section>

  <section id="exito" class="oculto">
    <div class="exito" aria-live="polite">✓ Entrega un postre gratis</div>
    <button id="btn-nuevo" class="btn btn-grande" type="button">Volver al menú</button>
  </section>
</main>

<script src="../config.js"></script>
<script src="../lib.js"></script>
<script src="../vendor/qrcode.js"></script>
<script src="caja.js"></script>
</body>
</html>
