<!doctype html>
<html lang="es" data-marca="tlatolli">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-title" content="Caja Tlatolli">
  <meta name="theme-color" content="#03211A">
  <title>Caja · Tlatolli</title>
  <link rel="icon" type="image/png" href="../img/icono.png">
  <link rel="apple-touch-icon" href="../img/icono.png">
  <link rel="stylesheet" href="../fonts/fonts.css?v=10">
  <link rel="stylesheet" href="../estilo.css?v=10">
  <link rel="stylesheet" href="caja.css?v=14">
</head>
<body class="caja">
<main>
  <header class="cabecera"><div class="greca"></div></header>

  <section id="carga">
    <div class="cargador" role="status">
      <div class="cargador-anillo"><div class="cargador-logo"><img src="../img/tlatolli-chico.jpg" alt="Tlatolli" width="320" height="212"></div></div>
      <p id="carga-verificando" class="cargador-texto" aria-live="polite">Verificando</p>
      <div class="cargador-greca" aria-hidden="true"></div>
    </div>
    <p id="carga-msg" aria-live="polite" class="oculto"></p>
    <button id="btn-reintentar" class="btn btn-oro oculto" type="button">Reintentar</button>
  </section>

  <section id="menu" class="oculto">
    <header class="caja-cab">
      <div class="caja-logo"><img id="logo-negocio" alt="" width="68" height="68"></div>
      <div class="caja-info">
        <h1 id="nombre"></h1>
        <p id="tipo"></p>
      </div>
      <button id="btn-salir" class="btn btn-chico btn-claro" type="button">Salir</button>
    </header>
    <div class="divisor" aria-hidden="true"><i></i></div>
    <div class="acciones">
      <button id="btn-venta" class="btn btn-con-icono icono-postre" type="button"><span class="btn-titulo">Generar QR por venta</span><span class="btn-sub">Tu tarjeta de lealtad</span><span class="greca-esq" aria-hidden="true"></span><span class="chevron" aria-hidden="true">›</span></button>
      <button id="btn-venta-q" class="btn btn-con-icono icono-estrella oculto" type="button"><img class="logo-q" src="../img/logo-240.png" width="52" height="52" alt="" aria-hidden="true"><span class="btn-titulo">Generar QR Quetzalitos</span><span class="btn-sub">Tarjeta Quetzalitos</span></button>
      <button id="btn-canje" class="btn btn-con-icono icono-estrella" type="button"><span class="btn-titulo">Canjear premio</span><span class="btn-sub">Código del cliente</span></button>
      <button id="btn-panel" class="btn btn-con-icono icono-panel" type="button"><span class="btn-titulo">Panel administrativo</span><span class="btn-sub">Ventas y clientes</span></button>
      <button id="btn-control" class="btn btn-con-icono icono-panel oculto" type="button"><span class="btn-titulo">Panel de control</span><span class="btn-sub">Administra todos los negocios</span></button>
    </div>
    <p id="menu-msg" aria-live="polite" class="oculto"></p>
  </section>

  <section id="venta" class="oculto">
    <h1 id="venta-titulo">QR de tu tarjeta</h1>
    <div class="superficie venta-tarjeta">
      <div class="qr-caja"><div id="qr"></div><img id="qr-logo" class="qr-logo" alt="" aria-hidden="true"></div>
      <p class="centro">Que el cliente lo escanee con la cámara</p>
      <p id="cuenta" class="cuenta"></p>
      <div class="barra"><i id="barra-venta"></i></div>
    </div>
    <div class="botones-venta">
      <button id="btn-listo" class="btn btn-oro" type="button">Listo</button>
      <button id="btn-cancelar-venta" class="btn" type="button">Cancelar venta</button>
    </div>
    <p id="venta-msg" aria-live="polite" class="oculto"></p>
  </section>

  <section id="canje" class="oculto">
    <h1>Canjear premio</h1>
    <div class="superficie">
      <label for="codigo">Código de 6 dígitos</label>
      <input id="codigo" class="campo" type="text" inputmode="numeric" maxlength="6" autocomplete="off">
      <button id="btn-validar" class="btn" type="button">Validar</button>
      <div class="ranura-msg"><p id="canje-msg" aria-live="polite" class="oculto"></p></div>
    </div>
    <button id="btn-volver-canje" class="btn btn-claro" type="button">Volver</button>
  </section>

  <section id="exito" class="oculto">
    <div id="exito-texto" class="exito" aria-live="polite">¡Entrega el premio!</div>
    <div class="divisor" aria-hidden="true"><i></i></div>
    <button id="btn-nuevo" class="btn" type="button">Volver al menú</button>
  </section>

  <footer class="pie"><div class="greca"></div></footer>
</main>

<div id="aviso" class="aviso oculto" role="status" aria-live="polite">
  <span class="aviso-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
  <div class="aviso-txt">
    <p id="aviso-titulo" class="aviso-titulo"></p>
    <p id="aviso-sub" class="aviso-sub"></p>
  </div>
  <button id="btn-cerrar-aviso" class="aviso-cerrar" type="button" aria-label="Cerrar aviso">×</button>
</div>

<script src="../config.js?v=10"></script>
<script src="../lib.js?v=10"></script>
<script src="../vendor/qrcode.js"></script>
<script src="caja.js?v=14"></script>
</body>
</html>
